<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,500;0,600;0,700&family=Archivo:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/student_login.css') }}"></head>
<body>
<div class="auth-shell"><div class="auth-brand"><span class="brand-mark">P</span><div><strong>Proctoring System</strong><span>Examination platform</span></div></div>
<div class="auth-card"><p class="eyebrow">STUDENT ACCESS</p><h1>Student Login</h1><p class="auth-copy">Enter your credentials to continue.</p>
<form id="loginForm"><div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="name@university.edu" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required></div><button type="submit">Sign in</button></form><p id="errormsg" class="error-text"></p><div class="auth-foot"><span>Need an account? <a href="/register">Register</a></span><a href="/adlogin">Admin login</a></div></div>
<p class="auth-note">Secure access • Examination monitoring enabled</p></div>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errormsg");

            const formData = new FormData();
            formData.append("email", email);
            formData.append("password", password);

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.error || "Login Failed";
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("role", data.role);
                localStorage.setItem("name", data.name || "");
                localStorage.setItem("student_id", data.student_id || "");

                if (data.role === "admin") {
                    window.location.href = "/admin";
                } else {
                    window.location.href = "/my-exams";
                }
            } catch (err) {
                errorMsg.innerText = "Something went wrong. Try again.";
            }
        });
    </script>

</body></html>
