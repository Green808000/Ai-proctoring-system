<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,500;0,600;0,700&family=Archivo:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/my_exams.css') }}">
</head>
<body>
<header class="student-header">
  <div class="brand"><span class="brand-mark">P</span><div><span class="brand-name">Proctoring System</span><span class="brand-sub">Student portal</span></div></div>
  <div class="profile-chip"><span class="profile-avatar" id="profileAvatar">?</span><span id="profileName">Student</span></div>
</header>
<main class="student-main">
  <section class="hero">
    <div><p class="eyebrow">STUDENT DASHBOARD</p><h1>Welcome</h1><p class="hero-copy">Review your scheduled examinations and enter an exam when it is available.</p></div>
    <div class="hero-note"><span class="hero-note-label">YOUR ACCOUNT</span><strong id="heroStudentName">Student</strong><span id="heroStudentId">—</span></div>
  </section>
  <section class="exam-section"><div class="section-head"><div><p class="eyebrow">UPCOMING</p><h2>Scheduled examinations</h2></div><span class="section-count" id="upcomingCount">0</span></div><div id="upcomingList" class="exam-grid"><div class="loading-card">Loading examinations…</div></div></section>
  <section class="exam-section"><div class="section-head"><div><p class="eyebrow">HISTORY</p><h2>Previous examinations</h2></div><span class="section-count" id="previousCount">0</span></div><div id="previousList" class="exam-grid"><div class="loading-card">Loading history…</div></div></section>
</main>
    <script>
        const studentId = localStorage.getItem('student_id');
        const studentName = localStorage.getItem('name');

        document.getElementById('profileName').innerText = studentName || 'Student';
        document.getElementById('heroStudentName').innerText = studentName || 'Student';
        const sid = studentId || '—';
        document.getElementById('heroStudentId').innerText = sid;
        const initials = (studentName || 'Student').split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0]).join('').toUpperCase() || '?';
        document.getElementById('profileAvatar').innerText = initials;

        function buildExamCard(exam, isPrevious) {
            const card = document.createElement('div');
            card.className = 'exam-card';

            const statusLabel = isPrevious
                ? (exam.session_status === 'completed' ? 'Completed' : 'Missed')
                : '';

            card.innerHTML = `
                <p class="course-code">${exam.course_code}</p>
                <h3>${exam.course_title}</h3>
                <p class="meta">Starts: ${new Date(exam.start_time).toLocaleString()}</p>
                <p class="meta">Duration: ${exam.time_hours} hour(s)</p>
                ${isPrevious
                    ? `<p class="status-label ${exam.session_status === 'completed' ? 'is-completed' : 'is-missed'}">${statusLabel}</p>`
                    : `<button onclick="startExam(${exam.exam_id})">Start exam</button>`
                }
            `;
            return card;
        }

        async function loadExams() {
            const upcomingDiv = document.getElementById('upcomingList');
            const previousDiv = document.getElementById('previousList');

            if (!studentId) {
                upcomingDiv.innerText = "You're not logged in. Please log in again.";
                previousDiv.innerText = "";
                return;
            }

            try {
                const res = await fetch(`/api/exam/my-exams-detailed/${studentId}`);
                const data = await res.json();

                upcomingDiv.innerHTML = '';
                document.getElementById('upcomingCount').innerText = data.upcoming.length;
                if (data.upcoming.length === 0) {
                    upcomingDiv.innerText = "No upcoming exams.";
                } else {
                    data.upcoming.forEach(exam => upcomingDiv.appendChild(buildExamCard(exam, false)));
                }

                previousDiv.innerHTML = '';
                document.getElementById('previousCount').innerText = data.previous.length;
                if (data.previous.length === 0) {
                    previousDiv.innerText = "No previous exams.";
                } else {
                    data.previous.forEach(exam => previousDiv.appendChild(buildExamCard(exam, true)));
                }
            } catch (err) {
                upcomingDiv.innerText = "Failed to load exams.";
            }
        }

        function startExam(examId) {
            // Identity verification (passport upload + live camera check) now
            // happens on verify.html, which creates the exam session itself
            // once the student passes. No need to call start-session here.
            window.location.href = `/verify?exam_id=${examId}`;
        }

        loadExams();
    </script>
    <!-- Task 5, Part B: idle timeout. Deliberately NOT included on the
         exam-taking page (index.html) — see the comment in the script
         itself for why. -->
    <script src="{{ url_for('static', filename='js/idle-timeout.js') }}"></script>
</body>
</html>
